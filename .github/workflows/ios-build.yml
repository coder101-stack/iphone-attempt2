name: AREM iOS Build Check

on:
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-26

    defaults:
      run:
        working-directory: AREM_KICKVAULT_IMAGE_UPDATED

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Xcode
        run: xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Build AREM
        run: npm run mobile:build

      - name: Generate iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Install AREM app icon
        run: |
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          cp assets/icon.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AREMIcon.png
          python3 - <<'PY'
          import json
          from pathlib import Path

          folder = Path('ios/App/App/Assets.xcassets/AppIcon.appiconset')
          data = {
              'images': [{
                  'filename': 'AREMIcon.png',
                  'idiom': 'universal',
                  'platform': 'ios',
                  'size': '1024x1024'
              }],
              'info': {'author': 'xcode', 'version': 1}
          }
          (folder / 'Contents.json').write_text(json.dumps(data, indent=2))
          PY

      - name: Compile iPhone simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
